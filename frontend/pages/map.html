<!DOCTYPE html>
<html>
<head>
  <title>Kavach Map</title>
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body id="mapi">
    <nav id="map-nav">
  <div style="display:flex;align-items:center;gap:0.5rem;">
    <div class="logo">Kav<span>ach</span></div>
  </div>
  <div class="nav-links">
    <a href="/map">Map</a>
    <a href="/alerts">Alerts</a>
    <a href="/dashboard" class="active">My Alerts</a>
  </div>
  <div class="nav-right">
    <a href="/logout" class="logout-link">Logout</a>
  </div>
</nav>
  <div id="map"></div>
    <button type="button" id="rprt">REPORT</button>
    <div id="form" class="hidden">
    <form action="/api/alerts" method="POST">
    <input type="text" id="title" placeholder="Title" required/>

        <div class="radio-group">
            <label><input type="radio" value="Emergency" name="type" checked required/> 🚨 Emergency</label>
            <label><input type="radio" value="nonemergency" name="type" required/> ⚠️ Non-emergency</label>
        </div>

        <input type="text" id="location" placeholder="Location" required/>

        <textarea id="remarks" placeholder="Remarks" rows="4" required></textarea>
        <div id="formError" class="error-text hidden"></div>

        <div class="radio-group">
            <label><input type="radio" value="active" name="status" checked required/> Active</label>
            <label><input type="radio" value="nonactive" name="status" required/> Non-active</label>
        </div>
    <button type="button" id="submit">Submit</button>
  </form>
    </div>
   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/socket.js"></script>
<script type="module" src="/js/map.js"></script>
</body>
</html>
