
<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:0.5rem;">
    <a class="logo" href="/dashboard">Kav<span>ach</span></a>
  </div>
  <div class="nav-links">
    <a href="/map">Map</a>
    <a href="/alerts">Alerts</a>
    <a href="/dashboard">My Alerts</a>
  </div>
  <div class="nav-right">
    <a href="/map" class="report-btn">+ Report</a>
    <a href="/logout" style="font-size:0.82rem;color:rgba(255,255,255,0.35);text-decoration:none;">Logout</a>
  </div>
</nav>

<div class="container">

  <!-- ALERT DETAIL CARD -->
  <div class="alert-card">
    <div class="card-top">
      <span class="type-badge emergency" id="emer"></span>
      <span class="status-badge" id="stat">● Active</span>
    </div>
    <div class="alert-title" id="title"></div>
    <div class="alert-remarks" id="remark"></div>
    <div class="alert-meta">
      <span class="meta-item" id="loc">📍</span>
      <span class="meta-item" id="time">🕐 </span>
    </div>
    <div class="actions">
      <button class="upvote-btn" id="up">▲ Upvote · </button>
      <button class="flag-btn" id="flag">⚑ Flag</button>
    </div>
  </div>

  <!-- MINI MAP -->
  <div class="mini-map-section">
    <div class="section-title">Location</div>
    <div class="mini-map" id="detail-map">
      <div class="map-placeholder">Map loading...</div>
    </div>
    <div class="location-name">📍</div>
  </div>

  <!-- COMMENTS -->
  <!-- COMMENTS -->
<div class="comments-section">
  <div class="section-title" id="commentsTitle">Comments</div>
  <div class="comments-list" id="commentsList">
  </div>
  <!-- COMMENT INPUT -->
  <div class="comment-input-row">
    <textarea class="comment-input" rows="2" placeholder="Add a comment..." id="urcom"></textarea>
    <button class="send-btn" id="sub">Send</button>
  </div>
</div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
<script src="/js/alert.js"></script>
</body>
</html>
